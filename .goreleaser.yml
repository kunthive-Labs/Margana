version: 2

# The GitHub repository is "Margana" (the marketing/brand name, see
# release.github below), but the shipped tool, binary, and every package are
# "marga". Set project_name explicitly so templated archive names use "marga"
# instead of defaulting to the repo name.
project_name: marga

before:
  hooks:
    - go mod tidy

builds:
  - id: marga
    main: ./cmd/marga
    binary: marga
    env:
      - CGO_ENABLED=0
    # goolm = mautrix's pure-Go Olm backend, so release binaries get E2EE
    # without a CGo dependency on system libolm.
    tags:
      - goolm
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: marga
    ids:
      - marga
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - config.example.toml
      - README.md
      - LICENSE
      - logo.png

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: kunthive-Labs
    name: Margana

# Homebrew (macOS/Linux). Publishes a Cask to kunthive-Labs/homebrew-tap, so
# `brew install kunthive-Labs/tap/marga` works once that repo exists (see
# docs/RELEASING.md). `brews:` (Formula) was deprecated by GoReleaser in favor
# of casks for pre-built binaries.
homebrew_casks:
  - name: marga
    repository:
      owner: kunthive-Labs
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/kunthive-Labs/Margana"
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: Apache-2.0
    binaries:
      - marga
    # Binaries downloaded outside the App Store are quarantined by Gatekeeper;
    # strip the attribute so `marga` launches without a security prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/marga"]
          end

nfpms:
  - package_name: marga
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    homepage: https://github.com/kunthive-Labs/Margana
    description: >
      Terminal-native, multi-network realtime chat client. One TUI for
      Discord (via a relay) and Matrix (direct, with end-to-end encryption),
      with a keyboard-driven interface and offline SQLite history.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    maintainer: "kunthive-Labs <hello@kunthive-Labs.dev>"
    section: net
    contents:
      - src: config.example.toml
        dst: /usr/share/doc/marga/config.example.toml

scoops:
  - name: marga
    repository:
      owner: kunthive-Labs
      name: scoop-bucket
    homepage: https://github.com/kunthive-Labs/Margana
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: Apache-2.0

# Nix user-repository publish is deferred until the kunthive-Labs/nixpkgs repo
# exists (roadmap C1 permits enabling nix/AUR later). Flip skip_upload to
# "false" once it's set up. The nix expression is still built and attached to
# the GitHub Release regardless.
nix:
  - name: marga
    skip_upload: "true"
    repository:
      owner: kunthive-Labs
      name: nixpkgs
    homepage: https://github.com/kunthive-Labs/Margana
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: asl20

# AUR publish is deferred until an AUR_KEY secret + the aur.archlinux.org
# package repo exist (roadmap C1 permits enabling nix/AUR later). Flip
# skip_upload to "false" once the key is wired up.
aurs:
  - name: marga-bin
    skip_upload: "true"
    homepage: "https://github.com/kunthive-Labs/Margana"
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    maintainers:
      - "kunthive-Labs <hello@kunthive-Labs.dev>"
    license: "Apache-2.0"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/marga-bin.git'
