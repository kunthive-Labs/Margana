version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: marga
    main: ./cmd/marga
    binary: marga
    env:
      - CGO_ENABLED=0
    # goolm = mautrix's pure-Go Olm backend, so release binaries get E2EE
    # without a CGo dependency on system libolm.
    tags:
      - goolm
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: marga
    builds:
      - marga
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - config.example.toml
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: kunthive-Labs
    name: Margana

brews:
  - name: marga
    repository:
      owner: kunthive-Labs
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/kunthive-Labs/Margana"
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: Apache-2.0
    test: |
      system "#{bin}/marga", "--help"
    install: |
      bin.install "marga"

nfpms:
  - package_name: marga
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    homepage: https://github.com/kunthive-Labs/Margana
    description: >
      Terminal-native, multi-network realtime chat client. One TUI for
      Discord (via a relay) and Matrix (direct, with end-to-end encryption),
      with a keyboard-driven interface and offline SQLite history.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    maintainer: "kunthive-Labs <hello@kunthive-Labs.dev>"
    section: net
    contents:
      - src: config.example.toml
        dst: /usr/share/doc/marga/config.example.toml

scoops:
  - name: marga
    repository:
      owner: kunthive-Labs
      name: scoop-bucket
    homepage: https://github.com/kunthive-Labs/Margana
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: Apache-2.0

nix:
  - name: marga
    repository:
      owner: kunthive-Labs
      name: nixpkgs
    homepage: https://github.com/kunthive-Labs/Margana
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    license: asl20

aurs:
  - name: marga-bin
    homepage: "https://github.com/kunthive-Labs/Margana"
    description: "Terminal-native, multi-network realtime chat client (Discord, Matrix)"
    maintainers:
      - "kunthive-Labs <hello@kunthive-Labs.dev>"
    license: "Apache-2.0"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/marga-bin.git'
