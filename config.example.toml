# Marga Terminal Configuration
#
# Place this file at:
#   Linux/macOS: ~/.config/marga/config.toml
#   Windows:     %APPDATA%\marga\config.toml
#
# Or pass a custom path: marga --config /path/to/config.toml
#
# Any field can be overridden with environment variables:
#   MARGA_USERNAME              → general.username
#   MARGA_CHANNEL               → general.channel
#   MARGA_WEBSOCKET_URL          → server.websocket_url
#   MARGA_WEBHOOK_URL            → server.webhook_url
#   MARGA_RELAY_URL              → server.relay_url
#   MARGA_AUTH_ENABLED           → auth.enabled (true/false)
#   MARGA_AUTH_PROVIDER          → auth.provider
#   MARGA_DISCORD_CLIENT_ID      → auth.discord.client_id
#   MARGA_DISCORD_CLIENT_SECRET  → auth.discord.client_secret (optional; private deployments)
#   MARGA_DISCORD_REDIRECT_URL   → auth.discord.redirect_url
#   MARGA_THEME                  → ui.theme
#   MARGA_HISTORY_LIMIT          → ui.history_limit
#   MARGA_GITHUB_TOKEN           → github.token
#   MARGA_GITHUB_REPO            → github.repo
#   MARGA_LOG_LEVEL              → logging.level (debug/info/warn/error)
#   MARGA_LOG_FILE               → logging.file
#   MARGA_LOG_FORMAT             → logging.format (text/json)
#   MARGA_PLUGINS_ENABLED        → plugins.enabled (true/false)
#   MARGA_PLUGINS_DIR            → plugins.dir
#
# See docs/CONFIGURATION.md for the complete reference.

# ── General ──────────────────────────────────────────────────────────────
[general]
# Display name shown next to your messages.
# Required unless using Discord auth (which populates this automatically).
username = ""

# Default channel to join on startup.
channel = "general"

# Discord identity fields — populated automatically after Discord OAuth login.
# Leave these empty unless you know what you're doing.
discord_id = ""
discord_username = ""
discord_global_name = ""
discord_avatar_url = ""

# ── Server ───────────────────────────────────────────────────────────────
# Marga ships NO hosted relay. These endpoints must point at a relay you run
# (or trust) before Discord will work. Matrix connects directly and needs none
# of this — see [[networks]] at the bottom. See docs/SELF_HOSTING.md.
[server]
# WebSocket relay server URL.
# This is where Marga subscribes to receive real-time messages.
# Required for Discord. Example: wss://relay.example.com/ws
websocket_url = ""

# Discord webhook URL for sending messages.
# Create one in your Discord server: Server Settings → Integrations → Webhooks.
# Required for Discord. Example: https://discord.com/api/webhooks/123456789/abcdef
webhook_url = ""

# Relay REST API base URL for fetching message history.
# Optional — history fetching is disabled if this is empty.
relay_url = ""

# Deprecated and unused: the web-setup onboarding path was removed, so no token
# is ever sent to a web host. Retained only for backward compatibility.
web_setup_url = ""

# ── Auth ─────────────────────────────────────────────────────────────────
[auth]
# Enable authentication. When true, Marga will use Discord OAuth2 on first run
# to authenticate your identity and populate general.username automatically.
enabled = true

# Authentication provider. Currently only "discord" is supported.
provider = "discord"

# ── Discord OAuth2 ────────────────────────────────────────────────────────
[auth.discord]
# Discord application client ID from https://discord.com/developers/applications
# Required for Discord auth — register your OWN application and paste its ID
# here (or set MARGA_DISCORD_CLIENT_ID). There is no shared default.
client_id = ""

# Discord application client secret (optional for confidential/private deployments).
# Leave empty for public/native CLI clients using PKCE.
client_secret = ""

# OAuth2 redirect URL. Must be a loopback address and must match
# what you configured in the Discord Developer Portal under OAuth2 → Redirects.
# The default port is 53682.
redirect_url = "http://127.0.0.1:53682/callback"

# Token fields — populated automatically after successful OAuth login.
# You should not need to edit these manually.
token_type = ""
scope = ""
expiry = ""

# ── UI ───────────────────────────────────────────────────────────────────
[ui]
# Color theme. Built-in: default, dracula, solarized, and "none"/"terminal"
# (inherit the terminal's own background — best for transparent or light
# terminals). Define custom palettes under [themes.<name>] (see the bottom of
# this file) and select them here by name.
# Tip: set NO_COLOR=1 in the environment to disable all color (bold/italic kept).
theme = "default"

# Number of messages to fetch on startup from the relay server.
history_limit = 100

# Inline image rendering protocol. Options: auto (default), iterm2, kitty, none.
# "auto" probes the environment. Set explicitly if running inside tmux where
# detection fails — e.g. image_protocol = "iterm2" for iTerm2+tmux.
# Override with MARGA_IMAGE_PROTOCOL env var.
image_protocol = "auto"

# ── GitHub Activity (shorthand) ────────────────────────────────────────────
# Optional. When `repo` is set, Marga shows a sidebar panel with the latest
# events from the GitHub repo, refreshed every 60 seconds. This block is now
# shorthand for a single `[[panels]]` entry of type "github" (see below); it is
# kept for backward compatibility. If you declare an explicit github panel in
# [[panels]], this block is ignored. Leave `repo` empty to disable it.
[github]
# Personal access token used to authenticate against the GitHub API.
# - Public repos: optional, but recommended (raises rate limit from 60/hr to
#   5000/hr).
# - Private repos: required, with `repo` scope (classic PAT) or `Contents:
#   Read` (fine-grained PAT).
# Create one at https://github.com/settings/tokens
token = ""

# Repository to track, in "owner/repo" format. Example: "kunthive-Labs/Margana".
repo = ""

# ── Ambient panels ─────────────────────────────────────────────────────────
# Configurable sidebar panels. Declare as many as you like; they render in the
# right-hand sidebar (up to a few at a time, sharing the available height). Each
# panel refreshes on its own interval. The [github] block above is shorthand for
# a single github panel; use [[panels]] for more control or additional sources.
#
# Fields:
#   type    — "github" (recent repo events), "ci" (GitHub Actions runs), or
#             "rss" (an RSS 2.0 feed). Required.
#   source  — "owner/repo" for github/ci, or the feed URL for rss. Required.
#   title   — panel heading. Optional; a sensible per-type default is used.
#   refresh — refresh interval as a Go duration ("30s", "5m"). Optional; 60s.
#   token   — GitHub PAT for github/ci panels. Optional (raises the rate limit;
#             required for private repos). Unused by rss.
#   enabled — set false to keep an entry but disable it. Optional; default true.
#
# [[panels]]
# type    = "github"
# source  = "kunthive-Labs/Margana"
# title   = "GitHub"
# refresh = "60s"
# token   = ""
#
# [[panels]]
# type    = "ci"
# source  = "kunthive-Labs/Margana"
# refresh = "120s"
#
# [[panels]]
# type    = "rss"
# source  = "https://hnrss.org/frontpage"
# title   = "Hacker News"
# refresh = "5m"

# ── Notifications ──────────────────────────────────────────────────────────
[notifications]
# Ring the terminal bell when you are @-mentioned (in a non-muted channel).
bell_on_mention = false

# Show an OS desktop notification on a mention when Marga is unfocused (or the
# mention is in another channel). Env override: MARGA_NOTIFY_DESKTOP.
desktop = false

# Channels for which mention notifications (and the bell) are suppressed.
# Case-insensitive. Example: muted_channels = ["bots", "ci-spam"]
muted_channels = []

# ── Logging ────────────────────────────────────────────────────────────────
# Diagnostic logging is OFF by default. Marga is a full-screen TUI, so logs are
# written to a FILE (never the terminal, which would corrupt the display).
# Enable logging by setting `file` here, or at runtime with `marga --debug` or
# `marga --log-file PATH`. See docs/TROUBLESHOOTING.md.
[logging]
# Minimum level to record: debug, info, warn, or error. Default: info.
level = "info"

# Destination path. Empty disables logging. `marga --debug` defaults this to
# <data-dir>/marga.log (e.g. ~/.local/share/marga/marga.log on Linux).
file = ""

# Encoding: "text" (human-readable, default) or "json" (one object per line).
format = "text"

# ── Plugins (Lua scripting) ────────────────────────────────────────────────
# Extend Marga with custom slash commands, keybindings, and message-hook bots
# written in Lua. Scripts run in a sandboxed, CGo-free VM (only base/table/
# string/math are available; os/io/require and the filesystem are withheld) and
# each call is bounded by a timeout. See docs/PLUGINS.md for the API.
#
# [plugins]
# enabled = true
# # Base directory for relative plugin paths. Defaults to <config-dir>/plugins
# # (e.g. ~/.config/marga/plugins on Linux). Env: MARGA_PLUGINS_DIR.
# dir = ""
#
# # List each script as a [[plugins.entries]] block. A single [plugins] table
# # cannot also be a [[plugins]] array in TOML, so entries are nested here.
# # `path` is absolute, or relative to `dir` above.
# [[plugins.entries]]
# path = "roll.lua"    # a worked example ships in docs/plugins/roll.lua
# enabled = true

# ── Additional networks (experimental) ─────────────────────────────────────
# Marga speaks to multiple chat networks behind one TUI. Discord (above) is
# implicit. Add other networks as [[networks]] entries. Secrets are stored in
# the OS keyring (service "marga-<id>"), never in this file.
#
# Matrix connects DIRECTLY to your homeserver (no relay). On first run, set
# MARGA_MATRIX_PASSWORD to log in; the token is then cached in the keyring.
#
# [[networks]]
# id         = "matrix"
# type       = "matrix"
# enabled    = true
# homeserver = "https://matrix.org"
# user_id    = "@you:matrix.org"   # non-secret; the access token lives in the keyring

# IRC connects DIRECTLY to any IRC network (no relay). SASL is optional: set the
# sasl_user below and store the password in the keyring (key "sasl_password")
# or via MARGA_IRC_PASSWORD. Port defaults to 6697 (tls=true) or 6667 (tls=false).
# IRC has no server-side history, edits, typing, or presence broadcast.
#
# [[networks]]
# id        = "irc"
# type      = "irc"
# enabled   = true
# server    = "irc.libera.chat"
# port      = 6697
# tls       = true
# nick      = "your_nick"
# sasl_user = "your_account"   # optional; omit for an anonymous connection

# ── Custom themes ──────────────────────────────────────────────────────────
# Define your own palette, then select it above with ui.theme = "<name>". Every
# key is optional; omitted keys fall back to the built-in "default" palette.
# Values are hex ("#rrggbb"/"#rgb") or an ANSI palette index ("0".."255").
#
# [themes.nord]
# bg                 = "#2e3440"
# fg                 = "#d8dee9"
# accent             = "#88c0d0"
# accent_dim         = "#4c566a"
# cyan               = "#8fbcbb"
# dim                = "#616e88"
# border             = "#434c5e"
# status_bg          = "#3b4252"
# err                = "#bf616a"
# warn               = "#ebcb8b"
# input_border       = "#434c5e"
# input_border_focus = "#88c0d0"
# selected_bg        = "#434c5e"
# username_colors    = ["#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead"]
