name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # goolm builds the pure-Go Olm backend (no CGo libolm); CGO_ENABLED=0
      # keeps the toolchain from requiring a C compiler for E2EE.
      - name: go vet
        run: go vet -tags goolm ./...
        env:
          CGO_ENABLED: "0"

      - name: build
        run: go build -tags goolm ./...
        env:
          CGO_ENABLED: "0"

      - name: test
        run: go test -tags goolm ./...
        env:
          CGO_ENABLED: "0"

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned version is installed via `go install` (rather than a marketplace
      # action) so the lint binary matches what developers run locally and the
      # version is upgraded deliberately. Build tags come from .golangci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m
        env:
          CGO_ENABLED: "0"

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The race detector requires cgo; goolm still selects the pure-Go Olm
      # backend, so no system libolm is needed.
      - name: test -race
        run: go test -race -tags goolm ./...
        env:
          CGO_ENABLED: "1"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Use the latest stable Go so the scan runs against a security-patched
      # standard library; govulncheck only fails on vulnerabilities the code
      # actually reaches.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -tags goolm ./...
