name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # goolm builds the pure-Go Olm backend (no CGo libolm); CGO_ENABLED=0
      # keeps the toolchain from requiring a C compiler for E2EE.
      - name: go vet
        run: go vet -tags goolm ./...
        env:
          CGO_ENABLED: "0"

      - name: build
        run: go build -tags goolm ./...
        env:
          CGO_ENABLED: "0"

      - name: test
        run: go test -tags goolm ./...
        env:
          CGO_ENABLED: "0"

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
